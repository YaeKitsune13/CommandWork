services:
  db:
    image: mysql:latest
    container_name: mysql_coop_project
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3300:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: "./api/Dinisify API"
      dockerfile: Dockerfile
    container_name: coop_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=coop_project;User=root;Password=1234;"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
