services:
  db:
    image: mysql:latest
    container_name: mysql_coop_project
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3300:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: "./api/"
      dockerfile: Dockerfile
    container_name: coop_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
