services:
  db:
    image: mysql:latest
    container_name: mysql_coop_project
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3300:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
